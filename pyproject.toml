[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "mses"
version = "1.0.0"
description = "Программа обработки сигналов мультисенсорной электрохимической системы"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "PyWavelets>=1.5.0",
    "plotly>=5.18.0",
    "streamlit>=1.31.0",
    "typer>=0.9.0",
]

[project.scripts]
mses = "mses.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mses"]